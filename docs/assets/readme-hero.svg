<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e153a"/>
      <stop offset="60%" stop-color="#111a4a"/>
      <stop offset="100%" stop-color="#16225e"/>
    </linearGradient>
    <pattern id="heroDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#445588" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" fill="url(#heroBg)"/>
  <rect width="1280" height="420" fill="url(#heroDots)"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1280" height="4" fill="#0e8a72"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 65)">
    <!-- Brand Glyph Lockup -->
    <g>
      <!-- Inverted Aperture Mark -->
      <g transform="scale(0.55)">
        <path d="M 64 12 L 108 34 L 108 60 L 86 60 L 86 46 L 64 35 L 38 48 L 38 80 L 64 93 L 90 80 L 90 70 L 64 70 L 64 54 L 108 54 L 108 94 L 64 116 L 18 93 L 18 35 Z" fill="#ffffff" fill-rule="evenodd"/>
        <rect x="58" y="58" width="12" height="12" rx="2" fill="#0e8a72"/>
      </g>
      <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="32" font-weight="800" letter-spacing="-0.03em" fill="#ffffff">Gauntlet<tspan fill="#44b48b">AI</tspan></text>
      
      <rect x="300" y="20" width="180" height="28" rx="5" fill="#1b2559" stroke="#33427d" stroke-width="1"/>
      <circle cx="316" cy="34" r="4" fill="#44b48b"/>
      <text x="330" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#cbd2e1">STUDIONET 61999</text>
    </g>

    <!-- Headline -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.03em" fill="#ffffff" line-height="1.2">
      Autonomous On-Chain Red-Teaming
    </text>
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.03em" fill="#44b48b">
      &amp; Alignment Licensing for AI Agents
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="400" fill="#a0aec0">
