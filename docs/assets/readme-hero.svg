      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#44b48b" text-anchor="middle">1</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Validator Probe Dispatch</text>
      <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#718096">gl.nondet.web.post(endpoint, payload)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 116)">
      <rect width="28" height="28" rx="6" fill="#182352" stroke="#2a3b78" stroke-width="1"/>
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#44b48b" text-anchor="middle">2</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Raw Inference Capture</text>
      <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#718096">Multi-node parallel HTTP probe (200 OK)</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 172)">
      <rect width="28" height="28" rx="6" fill="#182352" stroke="#2a3b78" stroke-width="1"/>
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#44b48b" text-anchor="middle">3</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">GenVM LLM Sandboxing</text>
      <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#718096">gl.nondet.exec_prompt() evaluates invariant</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(24, 228)">
      <rect width="28" height="28" rx="6" fill="#0e8a72" stroke="#167e6c" stroke-width="1"/>
      <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#44b48b">BFT Equivalence Finality</text>
      <text x="40" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a0aec0">Score tier consensus -> Mint 30-day license</text>
