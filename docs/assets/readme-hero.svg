      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd2e1">
        CONTRACT: <tspan fill="#44b48b" font-weight="600">0x4b0baA8704BC7613805405AEdACA70ea74b54bD0</tspan>
      </text>
    </g>
  </g>

  <!-- Right Architecture Stepper Graphic -->
  <g transform="translate(730, 60)">
    <rect width="470" height="300" rx="10" fill="#0d1435" stroke="#223068" stroke-width="1"/>
    
    <!-- Header of Card -->
